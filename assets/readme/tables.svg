<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="620" viewBox="0 0 1200 620"
     role="img" aria-labelledby="tblTitle tblDesc">
  <title id="tblTitle">首次使用自动创建的六张钉钉 AI 表</title>
  <desc id="tblDesc">配置表为输入核心，任务执行后在结果表、达人主档表、联系方式查看日志、每日额度审计、任务执行游标表五张表中落库。</desc>

  <rect width="1200" height="620" rx="24" fill="#0B0E14"/>

  <text x="56" y="52" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif"
        font-size="28" font-weight="700" fill="#F2F5F9">首次使用，自动建好六张表</text>
  <text x="56" y="82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif"
        font-size="17" fill="#8A93A6">Base「达人广场筛选与联系回填配置」— 无需手工建表，缺表缺字段自动补齐</text>

  <!-- 左：配置表 -->
  <g transform="translate(56 116)">
    <rect width="330" height="440" rx="14" fill="#11151F" stroke="#FE2C55" stroke-width="2"/>
    <rect x="20" y="20" width="88" height="26" rx="13" fill="#FE2C55"/>
    <text x="64" y="38" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">输入</text>
    <text x="118" y="38" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,sans-serif" font-size="20" font-weight="700" fill="#F2F5F9">配置表</text>
    <text x="20" y="76" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,sans-serif" font-size="14" fill="#8A93A6">一行 = 一个筛选任务，字段即筛选条件</text>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#C7CEDB">
      <text x="20" y="112">任务ID · 启用</text>
      <text x="20" y="140">常驻城市 · 优势品类</text>
      <text x="20" y="168">视频/直播带货力 · 内容力</text>
      <text x="20" y="196">达人粉丝数 · 达人类型</text>
      <text x="20" y="224">有微信/电话 · 是否合作过</text>
      <text x="20" y="252">短视频/直播报价区间</text>
      <text x="20" y="280">查询次数 · 每页数量</text>
    </g>

    <rect x="20" y="312" width="290" height="100" rx="10" fill="#181D2A"/>
    <text x="36" y="340" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,sans-serif" font-size="15" fill="#C7CEDB">查询次数 = 本任务最多打开多少次</text>
    <text x="36" y="364" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,sans-serif" font-size="15" fill="#FE2C55">「查看联系方式」弹窗</text>
    <text x="36" y="392" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,sans-serif" font-size="14" fill="#8A93A6">执行结果列自动回写每次运行摘要</text>
  </g>

  <!-- 中：任务引擎 -->
  <g transform="translate(416 296)">
    <rect width="150" height="80" rx="40" fill="#11151F" stroke="#25F4EE" stroke-width="2"/>
    <text x="75" y="38" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" fill="#25F4EE">run_talent</text>
    <text x="75" y="60" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" fill="#25F4EE">_task.py</text>
  </g>

  <path d="M 386 336 L 410 336" stroke="#FE2C55" stroke-width="2.5" marker-end="url(#arrR)"/>

  <!-- 右侧 5 张输出表 -->
  <g transform="translate(596 116)" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,sans-serif">
    <!-- 结果表 -->
    <g>
      <rect width="548" height="76" rx="12" fill="#11151F" stroke="#2A3245" stroke-width="1.5"/>
      <rect x="16" y="16" width="88" height="24" rx="12" fill="#25F4EE"/>
      <text x="60" y="33" text-anchor="middle" font-size="13" font-weight="600" fill="#0B0E14">输出</text>
      <text x="116" y="33" font-size="17" font-weight="700" fill="#F2F5F9">结果表</text>
      <text x="16" y="60" font-size="14" fill="#8A93A6">达人昵称/抖音号/城市/品类 + 18 项带货指标 + 微信号 + 是否消耗额度</text>
    </g>
    <!-- 达人主档表 -->
    <g transform="translate(0 88)">
      <rect width="548" height="76" rx="12" fill="#11151F" stroke="#2A3245" stroke-width="1.5"/>
      <rect x="16" y="16" width="88" height="24" rx="12" fill="#25F4EE"/>
      <text x="60" y="33" text-anchor="middle" font-size="13" font-weight="600" fill="#0B0E14">缓存</text>
      <text x="116" y="33" font-size="17" font-weight="700" fill="#F2F5F9">达人主档表</text>
      <text x="16" y="60" font-size="14" fill="#8A93A6">dedupe_key 去重主键 + 微信号/虚拟手机号 + 首次/最近获取时间</text>
    </g>
    <!-- 联系方式查看日志 -->
    <g transform="translate(0 176)">
      <rect width="548" height="76" rx="12" fill="#11151F" stroke="#2A3245" stroke-width="1.5"/>
      <rect x="16" y="16" width="88" height="24" rx="12" fill="#25F4EE"/>
      <text x="60" y="33" text-anchor="middle" font-size="13" font-weight="600" fill="#0B0E14">审计</text>
      <text x="116" y="33" font-size="17" font-weight="700" fill="#F2F5F9">联系方式查看日志</text>
      <text x="16" y="60" font-size="14" fill="#8A93A6">每次弹窗查看/缓存复用一条：动作/状态/消耗额度/查看前后剩余</text>
    </g>
    <!-- 每日额度审计 -->
    <g transform="translate(0 264)">
      <rect width="548" height="76" rx="12" fill="#11151F" stroke="#2A3245" stroke-width="1.5"/>
      <rect x="16" y="16" width="88" height="24" rx="12" fill="#25F4EE"/>
      <text x="60" y="33" text-anchor="middle" font-size="13" font-weight="600" fill="#0B0E14">额度</text>
      <text x="116" y="33" font-size="17" font-weight="700" fill="#F2F5F9">每日 30 次额度审计</text>
      <text x="16" y="60" font-size="14" fill="#8A93A6">按日期+账号快照：每日额度/保留额度/已消耗/剩余/可继续查看</text>
    </g>
    <!-- 任务执行游标表 -->
    <g transform="translate(0 352)">
      <rect width="548" height="76" rx="12" fill="#11151F" stroke="#2A3245" stroke-width="1.5"/>
      <rect x="16" y="16" width="88" height="24" rx="12" fill="#25F4EE"/>
      <text x="60" y="33" text-anchor="middle" font-size="13" font-weight="600" fill="#0B0E14">游标</text>
      <text x="116" y="33" font-size="17" font-weight="700" fill="#F2F5F9">任务执行游标表</text>
      <text x="16" y="60" font-size="14" fill="#8A93A6">每次运行状态：筛选摘要/扫描页码/已采集数量/状态/备注</text>
    </g>
  </g>

  <!-- 引擎到 5 张表的连线 -->
  <path d="M 566 336 L 590 336" stroke="#25F4EE" stroke-width="2.5" marker-end="url(#arrC)"/>

  <defs>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FE2C55"/>
    </marker>
    <marker id="arrC" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#25F4EE"/>
    </marker>
  </defs>
</svg>
